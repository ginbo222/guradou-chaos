<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本棚ビューア</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://unpkg.com/megajs@1.3.0/dist/main.browser-esm.js" type="module"></script>
</head>
<body>
  <div id="auth-screen" class="screen">
    <h2 id="auth-title">パスワード</h2>
    <p id="auth-sub">入室用パスワードを入力</p>
    <input type="password" id="auth-input" placeholder="パスワード">
    <button id="auth-btn" type="button">入室</button>
    <p id="auth-error" class="error hidden"></p>
  </div>

  <div id="start-screen" class="screen hidden">
    <header class="header">
      <h1>本棚</h1>
      <button id="lock-btn" type="button" class="icon-btn">🔒</button>
    </header>
    <div id="shelf-list" class="shelf-list"></div>
    <button id="add-folder-btn" type="button" class="fab">+</button>
  </div>

  <div id="add-screen" class="screen hidden">
    <h2>フォルダ追加</h2>
    <input type="text" id="folder-name" placeholder="名前">
    <input type="text" id="folder-url" placeholder="MEGA URL">
    <div class="btn-group">
      <button id="save-folder-btn" type="button">保存</button>
      <button id="cancel-add-btn" type="button" class="secondary">キャンセル</button>
    </div>
    <p id="add-error" class="error hidden"></p>
  </div>

  <div id="loading-screen" class="screen hidden">
    <div class="spinner"></div>
    <p id="loading-text">読み込み中...</p>
    <p id="loading-progress"></p>
  </div>

  <div id="viewer-screen" class="screen hidden">
    <div id="viewer" class="viewer">
      <div id="page-left" class="page-slot"></div>
      <div id="page-right" class="page-slot"></div>
    </div>
    <footer class="viewer-footer">
      <span id="page-info">0 / 0</span>
      <input type="range" id="page-slider" min="1" max="1" value="1">
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
