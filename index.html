<!<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>マイライブラリ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
    }

    header {
      padding: 18px;
      background: #1c1c1c;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    #content {
      padding: 15px;
    }

    .folder {
      background: #222;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    .folder:active {
      transform: scale(0.98);
    }

    .file {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 8px;
    }

    .back {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 15px;
      background: #333;
      border-radius: 8px;
      cursor: pointer;
    }

    .loading {
      opacity: 0.7;
      padding: 20px 0;
    }

    .error {
      color: #ff7777;
      padding: 20px 0;
    }
  </style>
</head>

<body>

<header>
  <h1 id="title">📚 マイライブラリ</h1>
</header>

<main id="content">
  <div class="loading">読み込み中…</div>
</main>

<script>

const content = document.getElementById("content");
const title = document.getElementById("title");


// -------------------------
// ① フォルダ一覧
// -------------------------

async function loadFolders() {

  content.innerHTML =
    '<div class="loading">フォルダを読み込み中…</div>';

  try {

    const response = await fetch("/api/folders");

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.error);
    }

    content.innerHTML = "";

    data.folders.forEach(folder => {

      const element = document.createElement("div");

      element.className = "folder";

      element.textContent = "📁 " + folder.name;

      element.onclick = () =>
        loadFolder(folder.name);

      content.appendChild(element);

    });

  } catch (error) {

    content.innerHTML =
      '<div class="error">読み込みエラー: '
      + error.message
      + '</div>';

  }
}


// -------------------------
// ② フォルダの中身
// -------------------------

async function loadFolder(name) {

  title.textContent = "📁 " + name;

  content.innerHTML =
    '<div class="loading">読み込み中…</div>';

  try {

    const response =
      await fetch(
        "/api/folder?name="
        + encodeURIComponent(name)
      );

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.error);
    }

    content.innerHTML = "";

    const back = document.createElement("div");

    back.className = "back";

    back.textContent = "← フォルダ一覧";

    back.onclick = () => {

      title.textContent =
        "📚 マイライブラリ";

      loadFolders();

    };

    content.appendChild(back);


    data.files.forEach(file => {

      const element =
        document.createElement("div");

      element.className = "file";

      if (file.directory) {

        element.textContent =
          "📁 " + file.name;

      } else {

        const lower =
          file.name.toLowerCase();

        if (lower.endsWith(".pdf")) {

          element.textContent =
            "📕 " + file.name;

        } else if (
          lower.endsWith(".jpg") ||
          lower.endsWith(".jpeg") ||
          lower.endsWith(".png") ||
          lower.endsWith(".webp") ||
          lower.endsWith(".gif")
        ) {

          element.textContent =
            "🖼️ " + file.name;

        } else {

          element.textContent =
            "📄 " + file.name;

        }

      }

      content.appendChild(element);

    });

  } catch (error) {

    content.innerHTML =
      '<div class="error">読み込みエラー: '
      + error.message
      + '</div>';

  }

}


// 最初にフォルダだけ取得

loadFolders();

</script>

</body>
</html>
