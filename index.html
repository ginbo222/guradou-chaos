<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>MEGA Comic Viewer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- パスワード -->
  <div id="auth-screen" class="screen hidden">
    <div class="start-box">
      <h1 id="auth-title">パスワード</h1>
      <p class="subtitle" id="auth-sub">入室用パスワードを入力</p>
      <input type="password" id="auth-input" placeholder="パスワード" autocomplete="current-password" />
      <button id="auth-btn" type="button">入室</button>
      <p id="auth-error" class="error hidden"></p>
    </div>
  </div>

  <!-- 本棚 -->
  <div id="start-screen" class="screen hidden">
    <div class="library-wrap">
      <h1>本棚</h1>
      <p class="subtitle">タップして読む</p>
      <div id="shelf-list"></div>
      <button id="add-folder-btn" type="button" class="secondary-btn">＋ 1件追加</button>
      <button id="bulk-folder-btn" type="button" class="secondary-btn">親フォルダから一括登録</button>
      <button id="lock-btn" type="button" class="text-btn">ロック</button>
    </div>
  </div>

  <!-- 1件追加 -->
  <div id="add-screen" class="screen hidden">
    <div class="start-box">
      <h1>フォルダを追加</h1>
      <input type="text" id="folder-name" placeholder="名前（例: 野菜）" autocomplete="off" />
      <input type="text" id="folder-url" placeholder="https://mega.nz/folder/xxxx#yyyy" autocomplete="off" spellcheck="false" />
      <button id="save-folder-btn" type="button">保存</button>
      <button id="cancel-add-btn" type="button" class="secondary-btn">キャンセル</button>
      <p id="add-error" class="error hidden"></p>
    </div>
  </div>

  <!-- 親から一括登録 -->
  <div id="bulk-screen" class="screen hidden">
    <div class="library-wrap">
      <h1>一括登録</h1>
      <p class="subtitle">親フォルダの直下を本棚に追加</p>
      <input type="text" id="bulk-url" placeholder="親フォルダのMEGAリンク" autocomplete="off" spellcheck="false" />
      <button id="bulk-fetch-btn" type="button">一覧を取得</button>
      <button id="bulk-cancel-btn" type="button" class="secondary-btn">キャンセル</button>
      <p id="bulk-status" class="tips-line"></p>
      <p id="bulk-error" class="error hidden"></p>
      <div id="bulk-list"></div>
      <button id="bulk-add-all-btn" type="button" class="hidden">全部本棚に追加</button>
    </div>
  </div>

  <!-- ローディング -->
  <div id="loading-screen" class="screen hidden">
    <div class="loader">
      <div class="spinner"></div>
      <p id="loading-text">読み込み中...</p>
      <p id="loading-progress"></p>
    </div>
  </div>

  <!-- ビューア -->
  <div id="viewer-screen" class="screen hidden">
    <div id="viewer">
      <div id="page-left" class="page-slot"></div>
      <div id="page-right" class="page-slot"></div>
    </div>
    <div id="click-left" class="click-zone"></div>
    <div id="click-right" class="click-zone"></div>
    <div id="ui-overlay">
      <div id="top-bar">
        <button id="back-btn" type="button" title="本棚に戻る">←</button>
        <span id="page-info">1 / 1</span>
        <button id="mode-btn" type="button" title="表示切替">見開き</button>
        <button id="fullscreen-btn" type="button" title="フルスクリーン">⛶</button>
      </div>
      <div id="bottom-bar">
        <input type="range" id="page-slider" min="0" max="0" value="0" />
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/megajs@1.3.1/dist/main.browser-umd.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
