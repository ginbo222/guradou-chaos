<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>MEGA Comic Viewer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="start-screen" class="screen">
    <div class="start-box">
      <h1>MEGA Comic Viewer</h1>
      <p class="subtitle">公開フォルダリンクを貼ってコミック風に読む</p>
      <input type="text" id="mega-url" placeholder="https://mega.nz/folder/xxxx#yyyy" autocomplete="off" spellcheck="false" />
      <button id="load-btn">読み込む</button>
      <p id="error-msg" class="error hidden"></p>
      <div class="tips">
        <p>対応: JPG / PNG / WebP / GIF / PDF</p>
        <p>ネストしたフォルダも自動で全部集めます</p>
        <p>横長ページは単独、縦長は見開きで表示</p>
      </div>
    </div>
  </div>
  <div id="loading-screen" class="screen hidden">
    <div class="loader">
      <div class="spinner"></div>
      <p id="loading-text">読み込み中...</p>
      <p id="loading-progress"></p>
    </div>
  </div>
  <div id="viewer-screen" class="screen hidden">
    <div id="viewer">
      <div id="page-left" class="page-slot"></div>
      <div id="page-right" class="page-slot"></div>
    </div>
    <div id="click-left" class="click-zone"></div>
    <div id="click-right" class="click-zone"></div>
    <div id="ui-overlay">
      <div id="top-bar">
        <button id="back-btn" type="button">←</button>
        <span id="page-info">1 / 1</span>
        <button id="fullscreen-btn" type="button">⛶</button>
      </div>
      <div id="bottom-bar">
        <input type="range" id="page-slider" min="0" max="0" value="0" />
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/megajs@1.3.1/dist/main.browser-umd.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
